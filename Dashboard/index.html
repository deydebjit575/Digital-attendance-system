<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Digital Attendance System</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <header>

            <h1>Digital Attendance System</h1>

            <p>ESP32 RFID Attendance Dashboard</p>

        </header>


        <section class="stats">

            <div class="card">

                <h3>Total Users</h3>

                <p id="totalUsers">
                    0
                </p>

            </div>


            <div class="card">

                <h3>Currently Inside</h3>

                <p id="insideUsers">
                    0
                </p>

            </div>


            <div class="card">

                <h3>Current Time</h3>

                <p id="currentTime">
                    --
                </p>

            </div>

        </section>


        <section class="dashboard">

            <h2>User Attendance</h2>

            <table>

                <thead>

                    <tr>

                        <th>Name</th>

                        <th>Status</th>

                        <th>Entry Time</th>

                        <th>Exit Time</th>

                    </tr>

                </thead>


                <tbody id="userTable">

                </tbody>

            </table>

        </section>


        <footer>

            <p>
                ESP32 RFID Attendance System
            </p>

            <p id="connectionStatus">
                Connecting...
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
